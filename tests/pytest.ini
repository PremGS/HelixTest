[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    -v
markers =
    smoke: fast smoke tests for CI gate
    integration: tests requiring live services
    e2e: full end-to-end browser tests
    ts003: tests belonging to TS-003 suite
